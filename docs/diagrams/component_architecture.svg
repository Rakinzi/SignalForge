  <line x1="330" y1="200" x2="380" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="200" x2="670" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="910" y1="200" x2="960" y2="200" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="790" y1="260" x2="790" y2="360" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="430" y1="480" x2="650" y2="480" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
