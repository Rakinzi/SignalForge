<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0b0f14"/>
  <text x="80" y="70" fill="#e5e7eb" font-size="24" font-family="system-ui">Data Flow</text>

  <rect x="120" y="160" width="220" height="90" rx="10" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="150" y="215" fill="#e5e7eb" font-size="16" font-family="system-ui">Packets</text>

  <rect x="380" y="160" width="220" height="90" rx="10" fill="#111827" stroke="#22d3ee" stroke-width="2"/>
  <text x="410" y="215" fill="#e5e7eb" font-size="16" font-family="system-ui">Flow Aggregation</text>

  <rect x="640" y="160" width="220" height="90" rx="10" fill="#111827" stroke="#f97316" stroke-width="2"/>
  <text x="670" y="215" fill="#e5e7eb" font-size="16" font-family="system-ui">Redis Streams</text>

  <rect x="900" y="160" width="220" height="90" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
  <text x="930" y="215" fill="#e5e7eb" font-size="16" font-family="system-ui">Detector</text>

  <rect x="300" y="360" width="260" height="90" rx="10" fill="#111827" stroke="#22c55e" stroke-width="2"/>
  <text x="330" y="415" fill="#e5e7eb" font-size="16" font-family="system-ui">Postgres (flows/alerts)</text>

  <rect x="640" y="360" width="220" height="90" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="670" y="415" fill="#e5e7eb" font-size="16" font-family="system-ui">API + SSE</text>

  <rect x="900" y="360" width="220" height="90" rx="10" fill="#111827" stroke="#34d399" stroke-width="2"/>
  <text x="940" y="415" fill="#e5e7eb" font-size="16" font-family="system-ui">UI</text>

  <line x1="340" y1="205" x2="380" y2="205" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="205" x2="640" y2="205" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="205" x2="900" y2="205" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="250" x2="430" y2="360" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="560" y1="405" x2="640" y2="405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="860" y1="405" x2="900" y2="405" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
