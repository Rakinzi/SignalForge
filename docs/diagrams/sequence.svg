<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0b0f14"/>
  <text x="80" y="70" fill="#e5e7eb" font-size="24" font-family="system-ui">Sequence Diagram</text>

  <text x="120" y="130" fill="#e5e7eb" font-size="14">Collector</text>
  <text x="360" y="130" fill="#e5e7eb" font-size="14">Redis</text>
  <text x="600" y="130" fill="#e5e7eb" font-size="14">Detector</text>
  <text x="840" y="130" fill="#e5e7eb" font-size="14">Postgres</text>
  <text x="1040" y="130" fill="#e5e7eb" font-size="14">API/UI</text>

  <line x1="140" y1="150" x2="140" y2="600" stroke="#374151" stroke-width="2"/>
  <line x1="380" y1="150" x2="380" y2="600" stroke="#374151" stroke-width="2"/>
  <line x1="620" y1="150" x2="620" y2="600" stroke="#374151" stroke-width="2"/>
  <line x1="860" y1="150" x2="860" y2="600" stroke="#374151" stroke-width="2"/>
  <line x1="1060" y1="150" x2="1060" y2="600" stroke="#374151" stroke-width="2"/>

  <line x1="140" y1="210" x2="380" y2="210" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="170" y="200" fill="#9ca3af" font-size="12">FlowEnded event</text>

  <line x1="380" y1="260" x2="620" y2="260" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="420" y="250" fill="#9ca3af" font-size="12">Consume event</text>

  <line x1="620" y1="320" x2="860" y2="320" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="650" y="310" fill="#9ca3af" font-size="12">Persist flows/alerts</text>

  <line x1="860" y1="380" x2="1060" y2="380" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="900" y="370" fill="#9ca3af" font-size="12">Read via API</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
