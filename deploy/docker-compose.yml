volumes:
  pcap-data:

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalforge
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  pcap-fetcher:
    image: alpine:3.19
    volumes:
      - pcap-data:/data
    command:
      - sh
      - -c
      - |
        if [ -f /data/traffic.pcap ]; then
          echo 'PCAP already present, skipping download'
        else
          apk add --no-cache curl &&
          curl -fL --retry 5 --retry-delay 2 -o /data/traffic.pcap https://github.com/arkime/arkime/raw/main/tests/pcap/arkime_synthetic.pcap &&
          echo 'PCAP downloaded successfully'
        fi
    restart: "no"

  collector:
    build:
      context: ../services/collector
    depends_on:
      redis:
        condition: service_healthy
      pcap-fetcher:
        condition: service_completed_successfully
    volumes:
      - pcap-data:/data:ro
    environment:
      REDIS_ADDR: redis:6379
      REDIS_STREAM: flows
      CAPTURE_MODE: pcap
      PCAP_PATH: /data/traffic.pcap
      PCAP_LOOP: "10"
      FLOW_IDLE_TIMEOUT: ${FLOW_IDLE_TIMEOUT:-10s}
      FLOW_MAX_DURATION: ${FLOW_MAX_DURATION:-5m}
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-2s}
    restart: "no"

  detector:
    build:
      context: ../services/detector
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      REDIS_STREAM: flows
      REDIS_GROUP: detector
      REDIS_CONSUMER: detector-1
      DATABASE_URL: postgresql+psycopg://signalforge:signalforge@postgres:5432/signalforge

  api:
    build:
      context: ../services/api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://signalforge:signalforge@postgres:5432/signalforge
      PORT: 8000
      JWT_SECRET: ${JWT_SECRET:-acaffcf16aabe4cc27576fb2f0110a70f4d432cd197f18e852e542e273ac3a50}
      JWT_EXPIRE_MIN: ${JWT_EXPIRE_MIN:-60}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-4fd98b722498982657092a18d9703b464176c543a733e16d}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-0af351b0a06143a05f5ac3f8fa6085afd440d7b4b60ae12b}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8088}
      AUTH_REQUIRE_EMAIL_VERIFIED: ${AUTH_REQUIRE_EMAIL_VERIFIED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-leightonsilver@gmail.com}
      SMTP_PASS: ${SMTP_PASS:-qxfjyciwtityhvrz}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-leightonsilver@gmail.com}

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    environment:
      PORT: 3000
    depends_on:
      api:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-errors:/usr/share/nginx/html/errors:ro
    depends_on:
      - frontend
      - api
