<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not Found</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0b0f14; color: #e5e7eb; }
    .wrap { min-height: 100vh; display: grid; place-items: center; }
    .card { max-width: 520px; padding: 32px; border: 1px solid #1f2937; border-radius: 12px; background: #0f1620; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { margin: 0; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Page not found</h1>
      <p>The requested resource does not exist.</p>
    </div>
  </div>
</body>
</html>
