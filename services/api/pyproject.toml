[project]
name = "signalforge-api"
version = "0.1.0"
description = "REST + SSE API for SignalForge"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.6.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "scapy>=2.5.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
]

[project.scripts]
run-api = "api.app:main"

[tool.uv]
package = true
